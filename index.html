<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trevor Bedford Citation Rates</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1 id="page-title"></h1>
            <div class="controls">
                <label class="toggle">
                    <span class="toggle-label">Yearly</span>
                    <input type="checkbox" id="accumulated-toggle">
                    <span class="toggle-slider"></span>
                    <span class="toggle-label">Accumulated</span>
                </label>
            </div>
        </header>
        <p class="subtitle" id="subtitle"></p>
        <div class="stats" id="stats"></div>

        <section id="hindex-section">
            <h2>H-index over time</h2>
            <div id="hindex-plot"></div>
        </section>

        <section id="stream-plot-section">
            <h2 id="stream-plot-title">All paper citations over time</h2>
            <div id="stream-plot"></div>
            <div class="legend" id="stream-legend"></div>
        </section>

        <section id="treemap-section">
            <div class="section-header">
                <h2>All paper citations at a specific year</h2>
                <select id="year-select"></select>
            </div>
            <div id="treemap-plot"></div>
        </section>

        <section id="line-plot-section">
            <div class="section-header">
                <h2>Specific paper citations over time</h2>
                <select id="paper-select"></select>
            </div>
            <div id="line-plot"></div>
            <div class="legend" id="line-legend"></div>
        </section>

        <div id="tooltip"></div>

        <footer>
            <span id="updated-date"></span>
            <a href="https://github.com/trvrb/index" target="_blank" rel="noopener">GitHub</a>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
